<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overdue Books</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Overdue Books</h1>
        </header>
        
        {% if overdue_books %}
            <h2>Overdue Books:</h2>
            <ul>
                {% for book in overdue_books %}
                    <li>
                        <strong>{{ book.title }}</strong> (Issued to: {{ book.usn }})
                        <br>Due Date: {{ book.due_date }}
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No overdue books at the moment.</p>
        {% endif %}
        
        <a href="{{ url_for('index') }}" class="btn">Back to Home</a>
    </div>
</body>
</html>
